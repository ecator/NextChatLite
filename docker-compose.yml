version: "3.9"
services:
  nextchat-lite:
    profiles: [ "no-proxy" ]
    container_name: nextchat-lite
    image: nextchat-lite
    ports:
      - 3000:3000
    environment:
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - GOOGLE_API_KEY=$GOOGLE_API_KEY
      - CODE=$CODE
      - OPENAI_URL=$OPENAI_URL
      - OPENAI_ORG_ID=$OPENAI_ORG_ID
      - HIDE_USER_API_KEY=$HIDE_USER_API_KEY
      - DISABLE_GPT4=$DISABLE_GPT4
      - ENABLE_BALANCE_QUERY=$ENABLE_BALANCE_QUERY
      - DISABLE_FAST_LINK=$DISABLE_FAST_LINK
      - OPENAI_SB=$OPENAI_SB
      - NEXTCHATLITE_TITLE=$NEXTCHATLITE_TITLE
      - NEXTCHATLITE_SUBTITLE=$NEXTCHATLITE_SUBTITLE

  nextchat-lite-proxy:
    profiles: [ "proxy" ]
    container_name: nextchat-lite-proxy
    image: nextchat-lite
    ports:
      - 3000:3000
    environment:
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - GOOGLE_API_KEY=$GOOGLE_API_KEY
      - CODE=$CODE
      - PROXY_URL=$PROXY_URL
      - OPENAI_URL=$OPENAI_URL
      - OPENAI_ORG_ID=$OPENAI_ORG_ID
      - HIDE_USER_API_KEY=$HIDE_USER_API_KEY
      - DISABLE_GPT4=$DISABLE_GPT4
      - ENABLE_BALANCE_QUERY=$ENABLE_BALANCE_QUERY
      - DISABLE_FAST_LINK=$DISABLE_FAST_LINK
      - OPENAI_SB=$OPENAI_SB
      - NEXTCHATLITE_TITLE=$NEXTCHATLITE_TITLE
      - NEXTCHATLITE_SUBTITLE=$NEXTCHATLITE_SUBTITLE
