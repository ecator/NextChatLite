<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 整体背景圆底阴影 -->
    <filter id="bg-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E5EFF" flood-opacity="0.15" />
    </filter>

    <!-- LITE 角标独立立体阴影（增强悬浮感与醒目度） -->
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0A256E" flood-opacity="0.35" />
    </filter>
    
    <!-- 图形渐变：清透亮蓝 -->
    <linearGradient id="blue-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B65FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5B9DFF" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="blue-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A54F8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#478BFF" stop-opacity="0.7" />
    </linearGradient>

    <!-- 角标高对比度渐变（深邃皇家蓝 -> 亮电光蓝） -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B38D6" />
      <stop offset="100%" stop-color="#1E6BFF" />
    </linearGradient>
  </defs>

  <!-- 白色圆形底板 -->
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" stroke="#E2ECFF" stroke-width="6" filter="url(#bg-shadow)" />

  <!-- 中心 N 字图形组合（略微上移左偏一点点，为大角标留出视觉呼吸感） -->
  <g transform="translate(-6, -8)">
    <!-- 左侧水滴图形 -->
    <path d="M 145 180 
             L 204 305 
             A 55 55 0 1 1 101 312 
             Z" fill="url(#blue-grad-1)" />

    <!-- 右侧上扬胶囊 -->
    <path d="M 264 316 
             L 318 178 
             A 55 55 0 0 1 420 218 
             L 366 356 
             A 55 55 0 0 1 264 316 Z" fill="url(#blue-grad-1)" />

    <!-- 中间斜向主胶囊 -->
    <path d="M 162 246 
             A 56 56 0 0 1 240 166 
             L 352 278 
             A 56 56 0 0 1 274 358 
             Z" fill="url(#blue-grad-2)" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.9" />
  </g>

  <!-- 强化版右下角 LITE 标识角标 -->
  <g transform="translate(262, 358)" filter="url(#badge-shadow)">
    <!-- 胶囊外框：加宽加高，8px 纯白描边将角标与主图形清晰切开 -->
    <rect x="0" y="0" width="186" height="68" rx="34" fill="url(#badge-grad)" stroke="#FFFFFF" stroke-width="8" />
    <!-- 放大加粗的 LITE 字样 -->
    <text x="95" y="46" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">LITE</text>
  </g>
</svg>